# EC2（本番）用の設定
# 使い方：EC2のプロジェクト直下の .env に「COMPOSE_FILE=docker-compose.prod.yml」と書く
# DBはRDSを使うため、db・phpmyadmin は含めない
# メールは MAIL_MAILER=log で laravel.log に書き出すため、mailpit も含めない
services:
  # Nginx（Webサーバー）
  # EC2上のNginx（HTTPS・certbot）から 127.0.0.1:8000 に転送される
  nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # PHP-FPM（アプリケーション）
  # DBの接続先は src/.env のRDSの設定を使う
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html
    networks:
      - app-network

# 仮想ネットワーク（同じネットワーク内のコンテナはサービス名で通信できる）
networks:
  app-network:
    driver: bridge
