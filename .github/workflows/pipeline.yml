name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ステップ1: コード品質チェック
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install
      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G   # 128MBだとメモリ不足で止まるため

  # ステップ2: テスト（lint が成功したら動く）
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, pdo, mysql
          coverage: xdebug   # カバレッジを測るためにXdebugを入れる
      - run: composer install
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Run migrations
        run: php artisan migrate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
      - name: Run tests
        run: php artisan test --coverage
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

  # ステップ3: Dockerイメージをビルドして Docker Hub に push（test が成功し、mainブランチのときだけ動く）
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Docker Hubにログイン
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # タグ：コミットSHA（例: abc1234）と latest
      - name: appイメージのタグを生成
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/myapp
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: appイメージをビルドしてpush
        uses: docker/build-push-action@v5
        with:
          context: .   # リポジトリ直下（Dockerfile の COPY で src/ を指定している）
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Nginx用イメージにも app と同じタグを付ける（ロールバックで両方そろって切り替わる）
      - name: Nginx用イメージのタグを生成（appと同じルール）
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/myapp-web
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Nginx用イメージ（public/ 入り）をビルドしてpush
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}

  # ステップ4: デプロイ（EC2は Docker Hub から新しいイメージを pull して起動するだけ）
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: EC2にSSH接続して新しいイメージをデプロイ
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/week10-practice
            # docker-compose.prod.yml・prod.conf を最新にする
            git pull origin main
            # Docker Hub から新しいイメージを取ってきて起動（古い構成のコンテナは --remove-orphans で削除）
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache
            # 使わなくなった古いイメージを削除して、EC2の容量を空ける
            docker image prune -f
