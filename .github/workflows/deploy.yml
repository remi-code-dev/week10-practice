name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: サーバーにSSH接続してデプロイ
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/week10-practice
            git pull origin main
            # 本番用の構成で起動（開発用の db・phpmyadmin が動いていれば --remove-orphans で止めて削除する）
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app composer install --no-dev --optimize-autoloader
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            # public/build はGitに含まれないので、Node.jsのコンテナでビルドする
            docker run --rm -v "$(pwd)/src:/app" -w /app node:22 sh -c "npm ci && npm run build"
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache
